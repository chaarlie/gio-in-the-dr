<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coccoloba — painted</title>
<link href="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.css" rel="stylesheet" />
<style>
  :root{
    --cream:#f1e8df; --surface:#e8dfd3; --card:#fbf8f2; --line:#e2d9cc;
    --ink:#1b1917; --muted:#8a8175; --accent:#141414; --coco:#e8722a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);overflow:hidden}
  #map{position:absolute;inset:0}

  .panel{
    position:absolute;top:16px;left:16px;width:310px;max-width:calc(100vw - 32px);
    max-height:calc(100vh - 32px);overflow-y:auto;
    background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;z-index:5;
  }
  .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:23px;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 4px;line-height:1.55}
  .grp{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
  .grp>p{margin:0 0 9px;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .actions{display:flex;gap:7px;flex-wrap:wrap}
  button{font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:9px 15px;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line);transition:background 150ms ease,border-color 150ms ease}
  button:hover{border-color:rgba(27,25,23,.3)}
  button.on{background:var(--accent);color:var(--cream);border-color:transparent}
  .swatches{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .swatches i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}

  /* Signage marker — the wordmark as it reads on the real core */
  .sign{
    background:#4e4a46;border-radius:5px;padding:7px 11px 8px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);text-align:left;line-height:1;white-space:nowrap;
    transform:translateY(-4px);
  }
  .sign .a{font-family:Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--coco)}
  .sign .a b{font-size:19px}
  .sign .b{font-size:7.5px;font-weight:700;letter-spacing:.34em;color:#cfc7bd;margin-top:4px}

  .gate{position:absolute;inset:0;display:grid;place-items:center;background:var(--cream);z-index:20;padding:24px}
  .gate-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;max-width:460px;width:100%}
  .gate input{width:100%;margin-top:14px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:14px;background:var(--cream);color:var(--ink);outline:none}
  .gate button{margin-top:14px;width:100%}
  .err{color:#b3261e;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <p class="eyebrow">Coccoloba · painted</p>
    <h1>Paste your public token</h1>
    <p class="sub">Starts with <code>pk.</code>. Kept in this tab only.</p>
    <input id="token" type="password" placeholder="pk.eyJ1..." autocomplete="off" spellcheck="false" />
    <div class="err" id="err"></div>
    <button class="on" id="go">Show the building</button>
  </div>
</div>

<div id="map"></div>

<div class="panel">
  <p class="eyebrow">Cabarete Bay</p>
  <h1>Coccoloba, painted</h1>
  <p class="sub">Eleven volumes, each carrying its own colour — sampled off your drone shots.</p>

  <div class="grp">
    <p>Finish</p>
    <div class="actions">
      <button class="on" data-m="painted">Painted</button>
      <button data-m="facade">Facade texture</button>
      <button data-m="massing">Massing only</button>
    </div>
    <div class="swatches" id="sw"></div>
  </div>

  <div class="grp">
    <p>View</p>
    <div class="actions">
      <button id="v-se">Entrance</button>
      <button id="v-roof">Rooftop</button>
      <button id="v-orbit">Orbit</button>
      <button id="v-flat">Flat</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/mapbox-gl@3/dist/mapbox-gl.js"></script>
<script src="coccoloba-styled.js"></script>
<script>
const LEVEL_M = 3;

const SWATCHES = [
  ["#e3d7c3","Rendered facade"],
  ["#4e4a46","Signage core"],
  ["#f4f1ea","Roof parapet"],
  ["#7f8f96","Balcony glass"],
  ["#c9a65b","Pergola slats"],
  ["#8a5a34","Rooftop deck"],
];

/* A facade texture drawn on a canvas at runtime — window rows and balcony
   bands. fill-extrusion-pattern tiles this across the walls, which is what
   stops a prism reading as a blank slab. */
function facadeTexture() {
  const w = 128, h = 128, c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = "#e3d7c3"; g.fillRect(0, 0, w, h);
  for (let row = 0; row < 4; row++) {
    const y = row * 32;
    g.fillStyle = "rgba(60,54,48,.10)";           // shadow under each slab
    g.fillRect(0, y + 27, w, 5);
    for (let i = 0; i < 4; i++) {                  // window openings
      g.fillStyle = "#3b3a38";
      g.fillRect(8 + i * 32, y + 8, 17, 15);
      g.fillStyle = "rgba(255,255,255,.16)";       // glazing highlight
      g.fillRect(8 + i * 32, y + 8, 17, 6);
    }
  }
  return g.getImageData(0, 0, w, h);
}

function init(token) {
  mapboxgl.accessToken = token;
  const map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/light-v11",
    center: COCCOLOBA_CORE,
    zoom: 18.6, pitch: 66, bearing: -34, antialias: true,
  });
  map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), "bottom-right");

  map.on("load", () => {
    map.addImage("facade", facadeTexture());
    map.addSource("cocco", { type: "geojson", data: COCCOLOBA });

    map.addLayer({
      id: "cocco-3d",
      type: "fill-extrusion",
      source: "cocco",
      paint: {
        "fill-extrusion-height": ["*", ["get", "floors"], LEVEL_M],
        "fill-extrusion-base": ["*", ["get", "base"], LEVEL_M],
        // Each volume carries its own colour on the feature.
        "fill-extrusion-color": ["get", "color"],
        "fill-extrusion-opacity": 1,
        "fill-extrusion-vertical-gradient": true,
        "fill-extrusion-ambient-occlusion-intensity": 0.4,
        "fill-extrusion-ambient-occlusion-radius": 3,
      },
    });
    map.setLight({ anchor: "map", position: [1.3, 215, 28], intensity: 0.38, color: "#fff3e0" });

    // Signage, as it sits on the real core
    const el = document.createElement("div");
    el.className = "sign";
    el.innerHTML = `<div class="a">coc<b>C</b>oloba</div><div class="b">RESIDENCE</div>`;
    new mapboxgl.Marker({ element: el, anchor: "bottom" })
      .setLngLat(COCCOLOBA_CORE).addTo(map);

    document.getElementById("sw").innerHTML = SWATCHES
      .map(([c, l]) => `<div><i style="background:${c}"></i>${l}</div>`).join("");

    function mode(m) {
      if (m === "facade") {
        // Pattern replaces colour; walls get windows and balcony shadows.
        map.setPaintProperty("cocco-3d", "fill-extrusion-pattern", "facade");
      } else {
        map.setPaintProperty("cocco-3d", "fill-extrusion-pattern", null);
        map.setPaintProperty("cocco-3d", "fill-extrusion-color",
          m === "massing" ? "#d8cfc2" : ["get", "color"]);
      }
      document.querySelectorAll("[data-m]").forEach((b) =>
        b.classList.toggle("on", b.dataset.m === m));
    }
    document.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => mode(b.dataset.m)));

    document.getElementById("v-se").onclick   = () => map.easeTo({ center: COCCOLOBA_CORE, zoom: 18.6, pitch: 68, bearing: -34, duration: 1000 });
    document.getElementById("v-roof").onclick = () => map.easeTo({ center: COCCOLOBA_CORE, zoom: 19.2, pitch: 40, bearing: 120, duration: 1000 });
    document.getElementById("v-flat").onclick = () => map.easeTo({ pitch: 0, bearing: 0, zoom: 18.4, duration: 900 });

    let spin = null;
    document.getElementById("v-orbit").onclick = (ev) => {
      if (spin) { cancelAnimationFrame(spin); spin = null; ev.target.classList.remove("on"); return; }
      ev.target.classList.add("on");
      const step = () => { map.setBearing(map.getBearing() + 0.18); spin = requestAnimationFrame(step); };
      step();
    };
  });

  map.on("error", (e) => {
    document.getElementById("err").textContent = (e && e.error && e.error.message) || "Map failed to load.";
    document.getElementById("gate").style.display = "grid";
  });
}

const input = document.getElementById("token");
function start() {
  const t = input.value.trim();
  if (!t.startsWith("pk.")) { document.getElementById("err").textContent = "That should start with “pk.”"; return; }
  document.getElementById("gate").style.display = "none";
  init(t);
}
document.getElementById("go").onclick = start;
input.addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });
input.focus();
</script>
</body>
</html>
